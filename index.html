<!DOCTYPE html>
<html lang="de-AT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Christoph Paur</title>
<meta name="description" content="Hier entsteht eine neue Seite von Christoph Paur. In Kürze mehr." />
<meta name="theme-color" content="#F6F4EF" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Christoph Paur" />
<meta property="og:description" content="Hier entsteht eine neue Seite. In Kürze mehr." />
<meta property="og:url" content="https://www.chrispaur.com/" />
<meta name="twitter:card" content="summary" />
<style>
  /* Bewusst ohne fremde Schriftserver: nichts wird nachgeladen, die Seite
     steht sofort, und es verlaesst keine Besucherinformation das Haus. */
  :root{
    --papier:#F6F4EF;
    --tinte:#14161A;
    --leise:#6B6A66;
    --linie:rgba(20,22,26,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--papier);color:var(--tinte);
    font:400 17px/1.6 "Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(28px,6vw,72px);
    position:relative;overflow-x:hidden;
  }
  /* Feines Korn, damit die Flaeche nicht steril wirkt. Rein dekorativ. */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }
  .blatt{width:100%;max-width:620px;position:relative;z-index:1}

  .marke{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--leise);margin:0 0 clamp(30px,7vw,52px);
    display:flex;align-items:center;gap:14px;
  }
  .marke::after{content:"";flex:1;height:1px;background:var(--linie)}

  h1{
    margin:0;font-weight:400;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:clamp(34px,7.4vw,58px);line-height:1.14;letter-spacing:-.012em;
  }
  h1 em{font-style:italic;color:var(--leise)}

  .lead{
    margin:clamp(20px,4vw,28px) 0 0;max-width:42ch;
    font-size:clamp(16px,2.2vw,18.5px);color:var(--leise);
  }

  .strich{height:1px;background:var(--linie);margin:clamp(34px,7vw,54px) 0 clamp(20px,4vw,26px)}

  .fuss{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;
    font-size:14.5px;color:var(--leise)}
  .fuss .name{color:var(--tinte)}
  .fuss a{color:var(--tinte);text-decoration:none;
    border-bottom:1px solid var(--linie);padding-bottom:1px;
    transition:border-color .25s ease}
  .fuss a:hover{border-bottom-color:var(--tinte)}

  .nebenan{margin:clamp(26px,5vw,34px) 0 0;font-size:13.5px;color:var(--leise)}
  .nebenan a{color:var(--leise);text-decoration:none;border-bottom:1px solid var(--linie)}
  .nebenan a:hover{color:var(--tinte);border-bottom-color:var(--tinte)}

  @media (prefers-color-scheme: dark){
    :root{--papier:#101215;--tinte:#EDEAE3;--leise:#93918B;--linie:rgba(237,234,227,.16)}
    body::after{opacity:.08}
  }
</style>
</head>
<body>
  <main class="blatt">
    <p class="marke">chrispaur.com</p>

    <h1>Hier entsteht<br />etwas <em>Neues.</em></h1>

    <p class="lead">Ich baue gerade an dieser Seite. Sie braucht noch etwas Zeit, dafür wird sie dann stimmen.</p>

    <div class="strich"></div>

    <p class="fuss">
      <span class="name">Christoph Paur</span>
      <a href="mailto:info@chrispaur.com">info@chrispaur.com</a>
    </p>

    <p class="nebenan">Sie suchen den Fitnessclub? <a href="https://www.teampaur.com/">teampaur.com</a></p>
  </main>
</body>
</html>
